name: construction-management-staging

services:
  backend:
    build:
      context: ./backend
    image: construction-management-backend:${STAGING_IMAGE_TAG:-staging}
    init: true
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./backend/.env.staging}
    environment:
      NODE_ENV: production
      PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_PORT:-3002}:3000"
