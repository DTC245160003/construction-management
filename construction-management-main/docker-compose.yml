name: construction-management-docker

services:
  backend:
    build:
      context: ./backend
    image: construction-management-backend:local
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_DOCKER_PORT:-3001}:3000"
