name: construction-management-staging

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: construction-management:${STAGING_IMAGE_TAG:-staging}
    init: true
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./backend/.env.staging}
    environment:
      NODE_ENV: production
      PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_PORT:-3002}:3000"

  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    image: construction-management-backup:${STAGING_IMAGE_TAG:-staging}
    init: true
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./backend/.env.staging}
    environment:
      BACKUP_CRON: "${BACKUP_CRON:-0 2 * * *}"
      BACKUP_DIR: /backups
      BACKUP_KEEP: "7"
      TZ: "${BACKUP_TIMEZONE:-Asia/Ho_Chi_Minh}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backups/staging:/backups
