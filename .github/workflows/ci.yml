name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sprint45:
    name: Offline PWA and PostgreSQL E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: construction_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRINT2_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/construction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run lint && npm run test:unit && npm run build
        working-directory: frontend
      - run: npm run test:sprint45
        working-directory: frontend
      - run: npm run test:system-admin
        working-directory: frontend
      - run: npm run test:real-regression && npm run test:ui-regression && npm run test:worker-dev
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint45-offline-evidence
          path: |
            frontend/test-results/sprint45
            frontend/playwright-report/sprint45
            docs/sprint4-5/playwright-results.json
            docs/sprint4-5/*regression-results.json
            docs/sprint4-5/worker-development-results.json
            docs/super-admin/playwright-results.json
            frontend/test-results/system-admin
  backend:
    name: Lint, test and Docker build (Node.js 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: construction_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d construction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRINT2_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/construction_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci

      - name: Build Docker image
        run: docker build --tag construction-management-backend:${{ github.sha }} .

      # Preparation only. Add a deploy job after a dedicated staging host is ready.
      - name: Prepare staging deployment (validate only)
        working-directory: ${{ github.workspace }}
        env:
          STAGING_ENV_FILE: ./backend/.env.staging.example
          STAGING_IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.staging.yml config --quiet
